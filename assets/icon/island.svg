<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Mallorca app icon: a flat, Orca-ish dark island scene.
       This SVG is the human-readable source of truth. The actual iconset PNGs
       are rendered by render_icon.swift (CoreGraphics) which draws the same
       shapes, because no SVG rasterizer is installed on the build machine. -->

  <!-- rounded-square background: deep Orca night sky/water -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="#1a1a1a"/>

  <!-- sky gradient band (upper) -->
  <rect x="0" y="0" width="1024" height="620" rx="224" ry="224" fill="#22242e"/>

  <!-- sun/moon -->
  <circle cx="760" cy="250" r="90" fill="#e8d9a8"/>

  <!-- sea -->
  <rect x="0" y="600" width="1024" height="424" fill="#2f6f7a"/>
  <rect x="0" y="600" width="1024" height="60" fill="#3f8b96"/>

  <!-- island sand mound -->
  <ellipse cx="512" cy="720" rx="320" ry="130" fill="#d9c48a"/>
  <ellipse cx="512" cy="700" rx="230" ry="95" fill="#e6d29a"/>

  <!-- palm trunk -->
  <path d="M498 700 C 500 620 470 540 450 470 L 500 470 C 520 545 540 625 542 700 Z" fill="#8a5a34"/>

  <!-- palm fronds -->
  <g fill="#3fa66a">
    <path d="M470 470 C 380 430 300 440 250 480 C 330 470 400 480 470 500 Z"/>
    <path d="M480 470 C 560 430 660 440 720 480 C 640 470 560 480 480 500 Z"/>
    <path d="M475 470 C 430 380 420 300 450 240 C 470 320 480 400 490 470 Z"/>
    <path d="M478 472 C 540 400 620 360 700 360 C 620 400 550 440 490 480 Z"/>
    <path d="M472 472 C 410 400 330 360 250 360 C 330 400 400 440 460 480 Z"/>
  </g>
  <circle cx="476" cy="466" r="22" fill="#2f8a55"/>

  <!-- little water glints -->
  <g fill="#bfe3e8" opacity="0.7">
    <rect x="150" y="820" width="90" height="12" rx="6"/>
    <rect x="760" y="860" width="120" height="12" rx="6"/>
    <rect x="360" y="900" width="70" height="12" rx="6"/>
  </g>
</svg>
