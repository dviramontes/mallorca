name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  odin:
    name: Odin
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ github.token }}
          release: latest

      - name: Install just
        run: brew install just

      # Clones both pinned dependencies: karl2d and fofoca. Must stay ahead of
      # the Rust steps below — they read fofoca/rust-toolchain.toml, which does
      # not exist until this clones it.
      - name: Set up karl2d and fofoca
        run: just setup

      - name: Set up Rust (fofoca)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: fofoca

      - name: Cache Rust (fofoca)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fofoca

      - name: Check Odin packages
        run: just check

      - name: Test Odin packages
        run: just test
