name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  odin:
    name: Odin
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ github.token }}
          release: latest

      - name: Install just
        run: brew install just

      - name: Set up karl2d
        run: just setup

      - name: Set up Rust (agent-habilis-mesh)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: agent-habilis-mesh

      - name: Cache Rust (agent-habilis-mesh)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-habilis-mesh

      - name: Check Odin packages
        run: just check

      - name: Test Odin packages
        run: just test
